<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Four data-slide slides</title></head>
<body>
  <div class="deck">
    <div data-slide><h1>Slide 1</h1></div>
    <div data-slide><h1>Slide 2</h1></div>
    <article data-slide="intro"><h1>Slide 3</h1></article>
    <div data-slide><h1>Slide 4</h1></div>
  </div>
  <section><p>Not a slide: data-slide marks win over sections.</p></section>
</body>
</html>
