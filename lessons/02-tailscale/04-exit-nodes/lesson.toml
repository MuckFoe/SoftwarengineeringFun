title = "Exit nodes and subnet routers"
summary = "Reach whole networks and route internet traffic through one device: advertise, approve, use."
minutes = 25

[[steps]]
kind = "explanation"
title = "Two ways to route through a device"
body = '''
So far every device you reached ran Tailscale itself. Two features let one device
carry traffic for others:

- A **subnet router** makes a whole network reachable from the tailnet, e.g. your home
  LAN `192.168.1.0/24` with a printer and a NAS that can't run Tailscale.
- An **exit node** carries *all* of a device's internet traffic: websites see the
  exit node's public IP, as with a VPN provider.

Both follow the same three steps: the device **advertises** what it offers, an admin
**approves** it in the admin console, and other devices **use** it.
'''

[[steps]]
kind = "explanation"
title = "Prepare a Linux router"
body = '''
To forward packets for others, a Linux device needs IP forwarding switched on.
Without it Tailscale warns that subnet routing and exit nodes will not work.

```
echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
sudo sysctl -p /etc/sysctl.d/99-tailscale.conf
```

On macOS and Windows the Tailscale app handles this itself.
'''

[[steps]]
kind = "terminal"
title = "Advertise a subnet"
body = '''
You are on `home-router`, a Linux box on the home LAN `192.168.1.0/24`, already in the
tailnet and with IP forwarding on. Advertise that subnet to the tailnet.
'''
hint = "`tailscale up` takes `--advertise-routes=` followed by the network in CIDR form."
[steps.check]
type = "terminal"
prompt = "root@home-router:~# "
[[steps.check.accept]]
command = "tailscale up --advertise-routes=192.168.1.0/24"
output = ""
[[steps.check.accept]]
command = "sudo tailscale up --advertise-routes=192.168.1.0/24"
output = ""
[[steps.check.accept]]
command = "tailscale set --advertise-routes=192.168.1.0/24"
output = ""
[[steps.check.responses]]
command = "tailscale up --advertise-routes=192.168.1.1/24"
output = "192.168.1.1/24 has non-address bits set; expected 192.168.1.0/24"
[[steps.check.responses]]
command = "tailscale up --advertise-routes"
output = "flag needs an argument: -advertise-routes"

[[steps]]
kind = "explanation"
title = "Approving routes"
body = '''
Advertising is only an offer. Nothing is routed until an admin approves it, so a
device can't quietly claim a network on its own.

In the **admin console**, open **Machines**, find `home-router` (it shows a
*Subnets* badge), open its menu and choose **Edit route settings**. Tick
`192.168.1.0/24` and save.

To approve automatically, the policy file can list **autoApprovers**:

```json
{
  "autoApprovers": {
    "routes":   {"192.168.1.0/24": ["tag:router"]},
    "exitNode": ["tag:exit"],
  },
}
```

A device tagged `tag:router` that advertises `192.168.1.0/24` is then approved
without anyone clicking.
'''

[[steps]]
kind = "quiz"
title = "Advertised, but not working"
body = '''
`home-router` advertises `192.168.1.0/24`, IP forwarding is on, and the admin
console shows the route. Your Mac still can't reach the NAS at `192.168.1.20`. What
is the most likely missing step?
'''
[steps.check]
type = "choice"
options = [
  "Install Tailscale on the NAS",
  "Approve the route under Edit route settings in the admin console",
  "Restart home-router",
  "Advertise the route again from the Mac",
]
correct = [2]
multiple = false

[[steps]]
kind = "explanation"
title = "Using subnet routes"
body = '''
Once approved, devices reach `192.168.1.0/24` through `home-router` using the LAN
addresses as they are: `ssh admin@192.168.1.20` just works.

macOS, Windows, iOS and Android accept approved routes automatically. **Linux does
not**: a Linux client must opt in with `--accept-routes`:

```
sudo tailscale up --accept-routes
```

Access to the routed addresses is still governed by the policy file, e.g.
`"dst": ["192.168.1.0/24:*"]`.
'''

[[steps]]
kind = "quiz"
title = "The Linux opt-in"
body = "Which `tailscale up` flag must a Linux client add to use approved subnet routes?"
hint = "It accepts routes."
[steps.check]
type = "text"
accept = ["--accept-routes", "accept-routes", "--accept-routes=true"]

[[steps]]
kind = "terminal"
title = "Advertise an exit node"
body = '''
On `exit-1`, a cloud VM in Amsterdam that is already in the tailnet with IP
forwarding on, offer the device as an exit node.
'''
hint = "The flag is `--advertise-exit-node`; it takes no value."
[steps.check]
type = "terminal"
prompt = "root@exit-1:~# "
[[steps.check.accept]]
command = "tailscale up --advertise-exit-node"
output = ""
[[steps.check.accept]]
command = "sudo tailscale up --advertise-exit-node"
output = ""
[[steps.check.accept]]
command = "tailscale set --advertise-exit-node"
output = ""
[[steps.check.responses]]
command = "tailscale up --exit-node"
output = "flag needs an argument: -exit-node"

[[steps]]
kind = "quiz"
title = "Approving an exit node"
body = '''
`exit-1` now shows an *Exit Node* badge in the admin console's Machines list, but
nobody can select it yet. Where does an admin approve it?
'''
[steps.check]
type = "choice"
options = [
  "In the machine's Edit route settings, by ticking Use as exit node",
  "By adding exit-1 to a group in the policy file",
  "In the DNS page of the admin console",
  "Nowhere: exit nodes never need approval",
]
correct = [1]
multiple = false

[[steps]]
kind = "terminal"
title = "Use the exit node"
body = '''
On your laptop, send all internet traffic through `exit-1`, whose Tailscale address
is `100.101.102.104`.
'''
hint = "`tailscale up --exit-node=` takes the exit node's Tailscale IP (or its name)."
[steps.check]
type = "terminal"
prompt = "alice@laptop ~ % "
[[steps.check.accept]]
command = "tailscale up --exit-node=100.101.102.104"
output = ""
[[steps.check.accept]]
command = "tailscale up --exit-node=exit-1"
output = ""
[[steps.check.accept]]
command = "tailscale set --exit-node=100.101.102.104"
output = ""
[[steps.check.accept]]
command = "tailscale set --exit-node=exit-1"
output = ""
[[steps.check.responses]]
command = "tailscale up --exit-node"
output = "flag needs an argument: -exit-node"
[[steps.check.responses]]
command = "tailscale up --advertise-exit-node"
output = "# That offers this laptop as an exit node. To use exit-1, pass --exit-node= with its address."

[[steps]]
kind = "explanation"
title = "Living with an exit node"
body = '''
While an exit node is in use, `tailscale status` marks it `exit node`, and a site
like `https://ifconfig.me` reports the exit node's public IP.

- By default the exit node also carries traffic to your local network, so the printer
  next to you may disappear. Add `--exit-node-allow-lan-access` to keep reaching it.
- Stop using the exit node with an empty value: `tailscale set --exit-node=`.
- The GUI apps offer the same choice under **Exit Node** in the Tailscale menu.
'''

[[steps]]
kind = "quiz"
title = "Which is which?"
body = "Select every statement that is true."
[steps.check]
type = "choice"
options = [
  "--advertise-routes offers a network; --exit-node chooses an exit node to use",
  "Advertised routes and exit nodes work as soon as they are advertised",
  "A Linux client needs --accept-routes to use approved subnet routes",
  "autoApprovers in the policy file can approve routes without a click in the admin console",
]
correct = [1, 3, 4]
multiple = true
