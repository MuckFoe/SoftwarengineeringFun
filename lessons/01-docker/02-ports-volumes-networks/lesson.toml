title = "Ports, volumes and networks"
summary = "Reach a container from your machine, keep data outside it, and let containers talk by name."
minutes = 25

[[steps]]
kind = "explanation"
title = "Containers are isolated"
body = """
Each container gets its own network stack. nginx inside a container listens on port 80,
but that's the **container's** port 80: from your machine, nothing answers on it.

To reach it you **publish** a port with `-p HOST_PORT:CONTAINER_PORT`. Docker then
forwards connections that arrive on the host's port to the container's port.

`-p 8080:80` means: host port 8080 → container port 80. The host side always comes first.
"""

[[steps]]
kind = "terminal"
title = "Publish a port"
body = """
Start nginx again, detached and named `web`, and publish container port 80 on host
port 8080:

`docker run -d --name web -p 8080:80 nginx`
"""
hint = "`-p` takes `host:container`. nginx listens on 80 inside the container."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker run -d --name web -p 8080:80 nginx"
output = "4ffdf4629862edbb180220edf534a272af9bf93798976b206509e10f49ae07cb"
[[steps.check.accept]]
command = "docker run -d -p 8080:80 --name web nginx"
output = "4ffdf4629862edbb180220edf534a272af9bf93798976b206509e10f49ae07cb"
[[steps.check.accept]]
command = "docker run --name web -d -p 8080:80 nginx"
output = "4ffdf4629862edbb180220edf534a272af9bf93798976b206509e10f49ae07cb"
[[steps.check.accept]]
command = "docker run -d --name web --publish 8080:80 nginx"
output = "4ffdf4629862edbb180220edf534a272af9bf93798976b206509e10f49ae07cb"

[[steps]]
kind = "terminal"
title = "Check the mapping"
body = """
`docker port <container>` shows which host ports lead to which container ports. Check `web`.
"""
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker port web"
output = '''
80/tcp -> 0.0.0.0:8080
80/tcp -> [::]:8080'''
[[steps.check.accept]]
command = "docker container port web"
output = '''
80/tcp -> 0.0.0.0:8080
80/tcp -> [::]:8080'''

[[steps]]
kind = "terminal"
title = "Call it from the host"
body = """
Now fetch the page from your machine with `curl`, on the **host** port you published.
"""
hint = "You published host port 8080: `curl http://localhost:8080`."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "curl http://localhost:8080"
output = '''
