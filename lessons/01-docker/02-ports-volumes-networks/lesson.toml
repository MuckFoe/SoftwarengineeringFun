[[steps.check.responses]]
command = "curl http://localhost:80"
output = "curl: (7) Failed to connect to localhost port 80 after 0 ms: Couldn't connect to server"
[[steps.check.responses]]
command = "curl localhost:80"
output = "curl: (7) Failed to connect to localhost port 80 after 0 ms: Couldn't connect to server"
[[steps.check.responses]]
command = "curl localhost"
output = "curl: (7) Failed to connect to localhost port 80 after 0 ms: Couldn't connect to server"

[[steps]]
kind = "quiz"
title = "Which side is which?"
body = """
You run `docker run -d -e POSTGRES_PASSWORD=example -p 5433:5432 postgres:16`. Postgres listens on 5432 inside the
container. Which port do you connect to **from your machine**?
"""
hint = "In `-p A:B`, A is on the host and B is in the container."
[steps.check]
type = "choice"
options = ["5432", "5433", "Either one", "Neither: Postgres can't be published"]
correct = [2]
multiple = false

[[steps]]
kind = "explanation"
title = "Container files are temporary"
body = """
Whatever a container writes goes into its own writable layer, and `docker rm` deletes that
layer. To keep data, or to give a container files from outside, you **mount** storage
into it with `-v SOURCE:TARGET` (target = a path inside the container):

- A **bind mount** maps a file or folder from the host: `-v "$(pwd)/site":/usr/share/nginx/html`.
  The source is a path (absolute, or starting with `./`). Edit the files on the host and the
  container sees the change at once. Good for code and config during development.
- A **named volume** is storage Docker creates and manages: `-v pgdata:/var/lib/postgresql/data`.
  The source is just a name. It outlives any container that uses it. Good for databases.

Add `:ro` at the end to mount read-only.
"""

[[steps]]
kind = "terminal"
title = "Bind-mount a folder"
body = """
In your current folder there's a `site/index.html` you wrote. Serve it with a second nginx,
named `site`, on host port 8081, by bind-mounting the `site` folder read-only over nginx's
web root:

`docker run -d --name site -p 8081:80 -v "$(pwd)/site":/usr/share/nginx/html:ro nginx`
"""
hint = "The source of a bind mount must be a path. `$(pwd)` expands to the current folder."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = 'docker run -d --name site -p 8081:80 -v "$(pwd)/site":/usr/share/nginx/html:ro nginx'
output = "17602924a3940cb715c5f65ac4575e1f9754566916666dda0141a9570c648a19"
[[steps.check.accept]]
command = 'docker run -d --name site -p 8081:80 -v "$(pwd)"/site:/usr/share/nginx/html:ro nginx'
output = "17602924a3940cb715c5f65ac4575e1f9754566916666dda0141a9570c648a19"
[[steps.check.accept]]
command = "docker run -d --name site -p 8081:80 -v $(pwd)/site:/usr/share/nginx/html:ro nginx"
output = "17602924a3940cb715c5f65ac4575e1f9754566916666dda0141a9570c648a19"
[[steps.check.accept]]
command = "docker run -d --name site -p 8081:80 -v ./site:/usr/share/nginx/html:ro nginx"
output = "17602924a3940cb715c5f65ac4575e1f9754566916666dda0141a9570c648a19"
[[steps.check.accept]]
command = 'docker run -d --name site -p 8081:80 --mount type=bind,source="$(pwd)/site",target=/usr/share/nginx/html,readonly nginx'
output = "17602924a3940cb715c5f65ac4575e1f9754566916666dda0141a9570c648a19"

[[steps]]
kind = "terminal"
title = "See your page"
body = "Fetch the page from host port 8081."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "curl http://localhost:8081"
output = '''
<!DOCTYPE html>
<html>
<body>
<h1>Hello from my laptop</h1>
</body>
</html>'''
[[steps.check.accept]]
command = "curl localhost:8081"
output = '''
<!DOCTYPE html>
<html>
<body>
<h1>Hello from my laptop</h1>
</body>
</html>'''

[[steps]]
kind = "quiz"
title = "Path or name?"
body = """
Suppose you had typed `-v site:/usr/share/nginx/html` instead (no `./`, no `$(pwd)`).
The container starts without an error. What does Docker mount?
"""
hint = "A source with no slash in it is not a path."
[steps.check]
type = "choice"
options = [
  "The site folder in the current directory",
  "A new, empty named volume called site",
  "Nothing: the option is ignored",
]
correct = [2]
multiple = false

[[steps]]
kind = "terminal"
title = "Create a named volume"
body = """
Create a named volume called `pgdata` for a database. Docker prints its name.

`docker volume create pgdata`
"""
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker volume create pgdata"
output = "pgdata"
[[steps.check.responses]]
command = "docker create volume pgdata"
output = '''
Unable to find image 'volume:latest' locally
Error response from daemon: pull access denied for volume, repository does not exist or may require 'docker login': denied: requested access to the resource is denied'''

[[steps]]
kind = "terminal"
title = "Use the volume"
body = """
Start Postgres 16 as `db`, with a password set through an environment variable, and its data
directory on the `pgdata` volume:

`docker run -d --name db -e POSTGRES_PASSWORD=example -v pgdata:/var/lib/postgresql/data postgres:16`
"""
hint = "For a named volume, the part before the colon is the volume's name, not a path."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker run -d --name db -e POSTGRES_PASSWORD=example -v pgdata:/var/lib/postgresql/data postgres:16"
output = '''
