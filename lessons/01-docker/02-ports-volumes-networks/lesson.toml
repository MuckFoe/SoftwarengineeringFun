Status: Downloaded newer image for postgres:16
27fe5647a3335d436a39ff5a5048eb612f90f7a2abf78de36041115b8f806701'''

[[steps]]
kind = "terminal"
title = "List volumes"
body = "List the volumes Docker manages."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker volume ls"
output = '''
DRIVER    VOLUME NAME
local     pgdata'''
[[steps.check.responses]]
command = "docker volumes"
output = '''
docker: 'volumes' is not a docker command.
See 'docker --help''''

[[steps]]
kind = "quiz"
title = "Does the data survive?"
body = """
You run `docker rm -f db` (force-remove, even while running), then start a new Postgres
container with the same `-v pgdata:/var/lib/postgresql/data`. Which is true?
"""
[steps.check]
type = "choice"
options = [
  "The database is empty again",
  "The tables and rows from before are still there",
  "Docker refuses: the volume belongs to the old container",
]
correct = [2]
multiple = false

[[steps]]
kind = "explanation"
title = "User-defined networks"
body = """
Containers that should talk to each other (an app and its database) go on the same
**user-defined bridge network**, made with `docker network create NAME`.

On a user-defined network, Docker runs a small DNS server: containers find each other
**by container name** (`db`, `web`). The default `bridge` network that containers join
when you don't say `--network` has no such name lookup, only IP addresses.

Containers on the same network reach each other on the container's own ports; you don't
need `-p` for that. Publish only what must be reached from outside.
"""

[[steps]]
kind = "terminal"
title = "Create a network"
body = "Create a network called `appnet`. Docker prints its ID."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker network create appnet"
output = "53cb66d2dbf90587dca7634fe073e4465b25312f5bf8cdc0ae14dc8bc84917e8"
[[steps.check.responses]]
command = "docker create network appnet"
output = '''
Unable to find image 'network:latest' locally
Error response from daemon: pull access denied for network, repository does not exist or may require 'docker login': denied: requested access to the resource is denied'''

[[steps]]
kind = "terminal"
title = "Connect the database"
body = """
`db` is already running. Attach it to `appnet` with `docker network connect NETWORK
CONTAINER`. It prints nothing when it works.
"""
hint = "The network comes first, then the container: `docker network connect appnet db`."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker network connect appnet db"
output = ""
[[steps.check.responses]]
command = "docker network connect db appnet"
output = "Error response from daemon: network db not found"

[[steps]]
kind = "terminal"
title = "Reach it by name"
body = """
Start a throwaway container on `appnet` (`--rm` deletes it when it exits) and ask
Postgres whether `db` is accepting connections:

`docker run --rm --network appnet postgres:16 pg_isready -h db`
"""
hint = "Without `--network appnet` the throwaway container lands on the default bridge, where the name `db` doesn't resolve."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker run --rm --network appnet postgres:16 pg_isready -h db"
output = "db:5432 - accepting connections"
[[steps.check.accept]]
command = "docker run --network appnet --rm postgres:16 pg_isready -h db"
output = "db:5432 - accepting connections"
[[steps.check.responses]]
command = "docker run --rm postgres:16 pg_isready -h db"
output = "db:5432 - no response"

[[steps]]
kind = "quiz"
title = "Finding each other"
body = "On a user-defined network, containers reach each other by their container …"
[steps.check]
type = "text"
accept = ["name", "names", "container name", "container names", "hostname"]
