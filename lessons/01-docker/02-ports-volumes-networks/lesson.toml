Status: Downloaded newer image for postgres:16
27fe5647a3335d436a39ff5a5048eb612f90f7a2abf78de36041115b8f806701'''
[[steps.check.accept]]
command = "docker run -d --name db -v pgdata:/var/lib/postgresql/data -e POSTGRES_PASSWORD=example postgres:16"
output = '''
Unable to find image 'postgres:16' locally
