[[steps]]
kind = "terminal"
title = "List running containers"
body = """
`docker ps` lists the containers that are running now: their ID, image, command, age,
status, published ports and name. (`docker container ls` is the same command under its
newer name.)
"""
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker ps"
output = '''
CONTAINER ID   IMAGE     COMMAND                  CREATED          STATUS          PORTS     NAMES
e5cb06f3e149   nginx     "/docker-entrypoint.…"   12 seconds ago   Up 11 seconds   80/tcp    web'''
[[steps.check.accept]]
command = "docker container ls"
output = '''
CONTAINER ID   IMAGE     COMMAND                  CREATED          STATUS          PORTS     NAMES
e5cb06f3e149   nginx     "/docker-entrypoint.…"   12 seconds ago   Up 11 seconds   80/tcp    web'''
[[steps.check.responses]]
command = "docker ls"
output = '''
docker: 'ls' is not a docker command.
See 'docker --help''''
[[steps.check.responses]]
command = "docker images"
output = '''
REPOSITORY   TAG       IMAGE ID       CREATED      SIZE
nginx        latest    3b25b682ea82   3 weeks ago   192MB'''

[[steps]]
kind = "terminal"
title = "Read the logs"
body = """
A detached container's output doesn't appear in your terminal. Docker keeps what the
container writes to standard output and standard error; `docker logs <name>` shows it.
Show the logs of `web`.
"""
hint = "`docker logs web`. Add `-f` in real life to keep following new lines."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker logs web"
output = '''
