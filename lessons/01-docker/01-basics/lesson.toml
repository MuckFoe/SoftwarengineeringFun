title = "Basics"
summary = "Images vs containers, and the commands to run, list, inspect, stop and remove them."
minutes = 20

[[steps]]
kind = "explanation"
title = "Images and containers"
body = """
Docker packages software so that it runs the same way everywhere. Two words matter most:

- An **image** is a read-only template: a filesystem (an operating system's files, your
  program, its libraries) plus some settings, such as which command to start. Images are
  built once and pulled from a *registry* such as Docker Hub. `nginx` and `postgres:16`
  are image names.
- A **container** is a running (or stopped) instance of an image. Docker gives it its own
  isolated processes, network and a thin writable layer on top of the image's files.

One image can start many containers, the way one program file can start many processes.
Deleting a container does not delete its image.

In this lesson you work on a pretend terminal: type the commands you're asked for, and
you'll see the output Docker would print. Nothing actually runs.
"""

[[steps]]
kind = "quiz"
title = "Image or container?"
body = "Which statements are true?"
hint = "Think of an image as the program file and a container as the process started from it."
[steps.check]
type = "choice"
options = [
  "An image is a read-only template for containers",
  "Starting a container changes the image it came from",
  "One image can be used to start several containers at once",
  "Removing a container also removes its image",
]
correct = [1, 3]
multiple = true

[[steps]]
kind = "terminal"
title = "Run a container"
body = """
Start a web server from the official `nginx` image. Run it in the background (*detached*)
with `-d`, and give the container the name `web` with `--name web`:

`docker run -d --name web nginx`

Options go **before** the image name; anything after the image name is passed to the
container as its command.
"""
hint = "The pattern is `docker run [options] IMAGE`. You need `-d` and `--name web`, then `nginx`."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker run -d --name web nginx"
output = '''
