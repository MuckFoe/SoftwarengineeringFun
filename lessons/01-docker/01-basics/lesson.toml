See 'docker logs --help'.

Usage:  docker logs [OPTIONS] CONTAINER

Fetch the logs of a container'''

[[steps]]
kind = "terminal"
title = "Run a command inside"
body = """
`docker exec <container> <command>` runs an extra command inside a **running** container,
next to its main process. It's how you look around in a container without stopping it.

List the files nginx serves, in `/usr/share/nginx/html`, inside `web`:

`docker exec web ls /usr/share/nginx/html`
"""
hint = "The container name comes right after `exec`, then the command to run in it."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker exec web ls /usr/share/nginx/html"
output = '''
50x.html
index.html'''
[[steps.check.responses]]
command = "docker exec ls /usr/share/nginx/html"
output = "Error response from daemon: No such container: ls"
[[steps.check.responses]]
command = "ls /usr/share/nginx/html"
output = "ls: /usr/share/nginx/html: No such file or directory"

[[steps]]
kind = "quiz"
title = "Getting a shell"
body = """
In real life you'd often want an interactive shell in a container. Which command opens one
in `web`?
"""
hint = "An interactive shell needs both stdin kept open and a terminal allocated."
[steps.check]
type = "choice"
options = [
  "docker exec web sh",
  "docker exec -it web sh",
  "docker run -it web sh",
  "docker logs -it web",
]
correct = [2]
multiple = false

[[steps]]
kind = "terminal"
title = "Stop the container"
body = """
`docker stop <name>` asks the container's main process to shut down (it sends a signal and,
after a 10-second grace period, kills it). Docker prints the name back when it's done.
Stop `web`.
"""
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker stop web"
output = "web"
[[steps.check.accept]]
command = "docker container stop web"
output = "web"
[[steps.check.responses]]
command = "docker rm web"
output = '''
Error response from daemon: cannot remove container "/web": container is running: stop the container before removing or force remove'''

[[steps]]
kind = "terminal"
title = "Stopped is not gone"
body = """
A stopped container still exists, with its writable layer, until you remove it. `docker ps`
hides it; `docker ps -a` (*all*) shows it. List all containers.
"""
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker ps -a"
output = '''
CONTAINER ID   IMAGE     COMMAND                  CREATED         STATUS                     PORTS     NAMES
e5cb06f3e149   nginx     "/docker-entrypoint.…"   4 minutes ago   Exited (0) 9 seconds ago             web'''
[[steps.check.accept]]
command = "docker ps --all"
output = '''
CONTAINER ID   IMAGE     COMMAND                  CREATED         STATUS                     PORTS     NAMES
e5cb06f3e149   nginx     "/docker-entrypoint.…"   4 minutes ago   Exited (0) 9 seconds ago             web'''
[[steps.check.responses]]
command = "docker ps"
output = "CONTAINER ID   IMAGE     COMMAND   CREATED   STATUS    PORTS     NAMES"

[[steps]]
kind = "terminal"
title = "Remove the container"
body = """
`docker rm <name>` deletes a stopped container and its writable layer. Remove `web`.
"""
hint = "`docker rm` removes containers; `docker rmi` removes images."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker rm web"
output = "web"
[[steps.check.accept]]
command = "docker container rm web"
output = "web"
[[steps.check.responses]]
command = "docker rmi web"
output = "Error response from daemon: No such image: web:latest"

[[steps]]
kind = "quiz"
title = "What's left?"
body = """
You removed the container `web`. Is the `nginx` image still on this machine? Answer
*yes* or *no*.
"""
hint = "Removing a container never removes the image it was started from."
[steps.check]
type = "text"
accept = ["yes", "y"]

[[steps]]
kind = "explanation"
title = "Recap"
body = """
- `docker run -d --name NAME IMAGE`: create and start a container in the background
- `docker ps` / `docker ps -a`: list running / all containers
- `docker logs NAME`: show what the container printed
- `docker exec NAME CMD`: run a command inside a running container
- `docker stop NAME`: stop it, keeping its files
- `docker rm NAME`: delete a stopped container

Images stay until you remove them with `docker rmi`. Next: reaching a container from
outside, and keeping data when containers come and go.
"""
