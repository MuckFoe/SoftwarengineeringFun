title = "Building images"
summary = "Write a Dockerfile, build and tag an image, use the layer cache and multi-stage builds, and push to a registry."
minutes = 30

[[steps]]
kind = "explanation"
title = "The Dockerfile"
body = """
So far you have run images other people built. To package your own app, you write a **Dockerfile**: a text file of instructions that `docker build` runs from top to bottom.

Here is one for a small Python web app. It sits in the project folder next to `app.py` and `requirements.txt`:

```dockerfile
FROM python:3.12-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
EXPOSE 8000
CMD ["python", "app.py"]
```

- `FROM` picks the base image to start from.
- `WORKDIR` sets the directory the following instructions (and the container) work in.
- `COPY` copies files from the **build context** (the folder you build from) into the image.
- `RUN` runs a command at build time and keeps its result in the image.
- `EXPOSE` documents the port the app listens on. It does not publish it; that is still `docker run -p`.
- `CMD` is the default command when a container starts from the image.
"""

[[steps]]
kind = "quiz"
title = "Build time or run time?"
body = "Which instruction runs when a **container starts**, rather than while the image is being built?"
hint = "One of them only records a default; nothing runs until `docker run`."
[steps.check]
type = "choice"
options = ["`RUN pip install ...`", "`COPY . .`", "`CMD [\"python\", \"app.py\"]`", "`WORKDIR /app`"]
correct = [3]
multiple = false

