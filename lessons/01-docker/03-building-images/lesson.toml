[[steps]]
kind = "explanation"
title = "Layers and the build cache"
body = """
An image is a stack of read-only **layers**. Each instruction that changes the filesystem (`RUN`, `COPY`, `ADD`) adds a layer on top of the one before.

Docker keeps the layers it built in a **build cache**. On the next build it walks the Dockerfile again and reuses a cached layer as long as the instruction is the same *and* its inputs are unchanged (for `COPY`, the copied files' contents). At the first instruction whose cache is invalid, that step and **every step after it** are rebuilt.

That is why the Dockerfile copies `requirements.txt` and installs dependencies *before* copying the rest of the source:

```dockerfile
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt   # cached until requirements.txt changes
COPY . .                                             # rebuilt on every source change
```

Had it started with `COPY . .`, every edit to `app.py` would reinstall all dependencies. Put what changes rarely near the top and what changes often near the bottom.
"""

[[steps]]
kind = "quiz"
title = "What gets rebuilt?"
body = """
With the Dockerfile from the first step, you edit **only** `app.py` and build again. Which steps actually run again (rather than being reused from the cache)?
"""
hint = "Find the first instruction whose inputs changed. Everything before it is cached."
[steps.check]
type = "choice"
options = [
  "All of them: any change rebuilds the whole image",
  "Only `COPY . .`",
  "`RUN pip install ...` and `COPY . .`",
  "None: Docker reuses the previous image unchanged",
]
correct = [2]
multiple = false

