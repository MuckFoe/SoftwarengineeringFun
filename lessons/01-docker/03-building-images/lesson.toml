[[steps]]
kind = "quiz"
title = "Keep things out of the context"
body = """
The build context is sent to the builder in full, and `COPY . .` copies all of it. Which file, placed next to the Dockerfile, lists paths (such as `.git` or `node_modules`) to leave out of the context?
"""
hint = "It works like `.gitignore`."
[steps.check]
type = "text"
accept = [".dockerignore", "dockerignore"]

[[steps]]
kind = "explanation"
title = "Multi-stage builds"
body = """
Building often needs tools the running app doesn't: compilers, package managers, test frameworks. A **multi-stage build** uses several `FROM` lines in one Dockerfile. Each starts a new stage; `COPY --from=<stage>` copies files out of an earlier one, and **only the last stage becomes the image**.

```dockerfile
# Stage 1: build a Go binary with the full toolchain
FROM golang:1.23 AS build
WORKDIR /src
COPY go.mod go.sum ./
RUN go mod download
COPY . .
RUN CGO_ENABLED=0 go build -o /out/server .

# Stage 2: ship only the binary
FROM gcr.io/distroless/static-debian12
COPY --from=build /out/server /server
ENTRYPOINT ["/server"]
```

The final image holds the binary on a tiny base, not the Go toolchain of the first stage: smaller to pull and with less in it to attack. To build just one stage, for example to run tests in it, use `docker build --target build .`.
"""

[[steps]]
kind = "quiz"
title = "What ends up in the image?"
body = "Which of these are true for the multi-stage Dockerfile above? Select all that apply."
[steps.check]
type = "choice"
options = [
  "Only the last stage ends up in the final image, unless you pick another with `--target`",
  "`COPY --from=build` copies files out of the earlier stage named `build`",
  "The Go compiler from the first stage is still inside the final image",
  "A Dockerfile may contain only one `FROM` line",
]
correct = [1, 2]
multiple = true

[[steps]]
kind = "explanation"
title = "Tags and registries"
body = """
A full image name looks like `registry/namespace/repository:tag`, for example `ghcr.io/alice/myapp:1.0`.

- The **registry** is the server that stores images. Leave it out and Docker uses Docker Hub (`docker.io`); official images there live under `library/`, so `python:3.12-slim` means `docker.io/library/python:3.12-slim`.
- The **tag** names a version. Leave it out and Docker uses `latest`, which is just a default name, not a promise of the newest build.
- A tag is a movable label pointing at an image ID. `docker tag SOURCE TARGET` adds another name to the same image without copying anything.

To share an image you name it for a registry, log in (`docker login ghcr.io`) and **push** it. Others then `docker pull` or `docker run` it by that name.
"""

[[steps]]
kind = "terminal"
title = "Name it for a registry"
body = """
You want to publish `myapp:1.0` to the GitHub Container Registry as `ghcr.io/alice/myapp:1.0`. Add that name to the image.
"""
hint = "`docker tag <source> <target>`. It prints nothing when it succeeds."
[steps.check]
type = "terminal"
[[steps.check.accept]]
command = "docker tag myapp:1.0 ghcr.io/alice/myapp:1.0"
output = ""
[[steps.check.responses]]
command = "docker tag ghcr.io/alice/myapp:1.0 myapp:1.0"
output = "Error response from daemon: No such image: ghcr.io/alice/myapp:1.0"

