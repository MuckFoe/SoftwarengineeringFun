<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative coding</title>
    <link rel="icon" href="%BASE_URL%icons/favicon.ico" sizes="any" />
    <link rel="icon" href="%BASE_URL%icons/collab-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/collab-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="manifest" href="%BASE_URL%icons/site.webmanifest" />
    <script>
      // Sets data-appearance before first paint (no flash). Same rules as src/theme/appearance.ts.
      (() => {
        let choice = "system";
        try {
          const stored = localStorage.getItem("appearance");
          if (stored === "light" || stored === "dark") choice = stored;
        } catch {}
        if (choice === "system") {
          const osDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
          choice = osDark ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-appearance", choice);
        // Same rules as src/theme/textSize.ts: the stored text size, else tokens.css's 0.75.
        const scales = { xs: 0.625, s: 0.75, m: 0.875, l: 1, xl: 1.125 };
        try {
          const size = localStorage.getItem("textSize");
          if (Object.hasOwn(scales, size)) {
            document.documentElement.style.setProperty("--text-scale", String(scales[size]));
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- After the app stylesheets (which Vite puts in the head), so the supplied icons override the fallback glyphs at equal specificity. -->
    <link rel="stylesheet" href="%BASE_URL%brand/brand.css" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
