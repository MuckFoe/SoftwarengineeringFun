<!doctype html>
<html lang="en"><head><title>Fake styleguide</title></head>
<body><div id="root"></div>
<script>
// SPA-like: the header only exists after a delayed client-side render.
setTimeout(() => {
  document.getElementById("root").innerHTML = '<header class="header"><svg class="logo" aria-label="Fake logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40"><circle cx="20" cy="20" r="15"/></svg></header><main>content</main>';
}, 150);
</script></body></html>
