<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specs</title>
<link rel="icon" href="data:,">
<!--
  Viewer and editor for this folder. It holds no spec content: every view is
  built at load time from README.md and the <NNN-slug>/{spec,plan,tasks,notes}.md
  files fetched beside it. Start the server that sits next to this file:

      python specs/serve.py

  then open http://127.0.0.1:8777/

  serve.py is what makes saving possible. Under any plain static server
  (python -m http.server) the page still works, read-only.
-->
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #d9dde3;
  --text: #1b1f24; --muted: #5c6670; --link: #0b5cad; --accent: #0b5cad;
  --code-bg: #eef0f3; --warn-bg: #fff4d6; --warn-border: #e0b040; --warn-text: #6b4a00;
  --err-bg: #fde8e8; --err-border: #d66; --err-text: #8a1f1f;
  --ok: #1a7f4b;
  --st-draft-bg: #e6e8eb; --st-draft-fg: #454d56;
  --st-approved-bg: #dbe9fb; --st-approved-fg: #0b4a8f;
  --st-planned-bg: #e9e1fa; --st-planned-fg: #54309a;
  --st-progress-bg: #fdecc8; --st-progress-fg: #7a4b00;
  --st-validated-bg: #d8f0e0; --st-validated-fg: #14603a;
  --st-unknown-bg: #f3dfe9; --st-unknown-fg: #7a2452;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a; --surface: #1c2024; --surface-2: #24292e; --border: #353c44;
    --text: #e4e7ea; --muted: #9aa4ae; --link: #7ab8f5; --accent: #7ab8f5;
    --code-bg: #262b31; --warn-bg: #3a2f10; --warn-border: #8a6d1c; --warn-text: #f1d48a;
    --err-bg: #3b1c1c; --err-border: #a44; --err-text: #f3b0b0;
    --ok: #5fd08f;
    --st-draft-bg: #2f353b; --st-draft-fg: #c3cad1;
    --st-approved-bg: #16345a; --st-approved-fg: #a9d0fb;
    --st-planned-bg: #33255c; --st-planned-fg: #cdbaf7;
    --st-progress-bg: #4a3608; --st-progress-fg: #f6d58a;
    --st-validated-bg: #153f29; --st-validated-fg: #9fe3bb;
    --st-unknown-bg: #4a1f36; --st-unknown-fg: #f3b6d4;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--link); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 16px; }
header.top h1 { font-size: 20px; margin: 0; flex: 0 1 auto; min-width: 0; }
header.top h1 a { color: inherit; text-decoration: none; }
.loaded { color: var(--muted); font-size: 13px; }
button, input[type="search"] {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
}
button { cursor: pointer; }
button:hover:not(:disabled) { background: var(--surface-2); }
button:disabled { opacity: .6; cursor: default; }
h2.section { font-size: 16px; margin: 28px 0 10px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.pad { padding: 12px 16px; }
.editbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin-bottom: 10px; }
.editbar .path { margin-right: auto; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
textarea.editor {
  display: block; width: 100%; min-height: 65vh; resize: vertical; box-sizing: border-box;
  font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; tab-size: 2;
}
.md input[type="checkbox"]:not(:disabled) { cursor: pointer; }
.mode { font-size: 12px; color: var(--muted); }

/* ---------- progress view ---------- */
/* Chart colours. One hue for "done" everywhere; "open" is a neutral, so the
   two states never depend on telling two hues apart. Dark values are chosen
   for the dark surface, not flipped. */
:root { --series-done: #2a78d6; --series-open: #c4cad2; }
@media (prefers-color-scheme: dark) { :root { --series-done: #3987e5; --series-open: #454d56; } }
.nav { display: flex; gap: 4px; margin: 0 auto 0 12px; }
.nav a { padding: 4px 10px; border-radius: 6px; text-decoration: none; color: var(--muted); font-size: 14px; }
.nav a:hover { color: var(--text); }
.nav a.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
.pg-filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 4px 0 12px; }
.pg-filters input[type="search"] { flex: 1 1 200px; min-width: 0; max-width: 300px; }
.pg-filters label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.pg-filters select { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
.pg-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
.pg-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.pg-tile .n { font-size: 26px; font-weight: 650; line-height: 1.15; font-variant-numeric: tabular-nums; }
.pg-tile .n small { font-size: 14px; font-weight: 400; color: var(--muted); }
.pg-tile .l { font-size: 12px; color: var(--muted); }
.pg-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.pg-chart { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.pg-chart h3 { margin: 0 0 2px; font-size: 14px; }
.pg-chart .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.pg-row { display: grid; grid-template-columns: minmax(64px, 46%) 1fr 3.4em; gap: 8px; align-items: center; padding: 4px 4px; margin: 0 -4px; font-size: 13px; border-radius: 4px; color: inherit; text-decoration: none; }
.pg-row.click { cursor: pointer; }
.pg-row:hover, .pg-row:focus-visible { background: var(--surface-2); }
.pg-row.on { background: var(--surface-2); font-weight: 600; }
.pg-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-row .val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; text-align: right; font-weight: 400; }
.pg-row .none { font-size: 12px; color: var(--muted); }
.hbar { display: flex; gap: 2px; height: 12px; min-width: 0; }
.hbar i { display: block; height: 100%; border-radius: 4px; min-width: 3px; }
.hbar .done { background: var(--series-done); }
.hbar .open { background: var(--series-open); }
.pg-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.pg-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; line-height: 1.4; padding: 5px 8px; border-radius: 6px; max-width: 280px; white-space: pre-line; }
.pg-group { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-top: 12px; }
.pg-group > header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 14px; }
.pg-group > header h3 { margin: 0; font-size: 15px; }
.pg-group > header h3 a { color: inherit; text-decoration: none; }
.pg-group > header h3 a:hover { text-decoration: underline; }
.pg-group > header .num { color: var(--muted); font-weight: 400; margin-right: 6px; }
.pg-group > header .right { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pg-group ul { list-style: none; margin: 0; padding: 0 14px 6px; }
.pg-group li { display: grid; grid-template-columns: auto 2em 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--border); font-size: 14px; }
.pg-group li.done .t { color: var(--muted); text-decoration: line-through; }
.pg-group li .n { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.pg-group li .chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.pg-group .empty { padding: 0 14px 12px; font-size: 13px; color: var(--muted); }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) {
  .pg-group li { grid-template-columns: auto 2em 1fr; }
  .pg-group li .chips { grid-column: 3; justify-content: flex-start; }
}
.muted { color: var(--muted); }
.small { font-size: 13px; }

.msg { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; background: var(--surface); margin: 12px 0; }
.msg.error { background: var(--err-bg); border-color: var(--err-border); color: var(--err-text); }
.msg pre { background: var(--code-bg); color: var(--text); padding: 10px 12px; border-radius: 6px; overflow-x: auto; margin: 10px 0 0; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.toolbar input[type="search"] { flex: 1 1 220px; min-width: 0; max-width: 360px; }
.summary { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

table.index { width: 100%; border-collapse: collapse; }
table.index th, table.index td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--border); }
table.index thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; white-space: nowrap; }
table.index tbody tr:last-child td { border-bottom: 0; }
table.index td.num { white-space: nowrap; color: var(--muted); }
table.index td.name { font-weight: 600; }
table.index td.name a { text-decoration: none; }
table.index td.name a:hover { text-decoration: underline; }
table.index td.oq { white-space: nowrap; }
.oq-open { font-weight: 700; color: var(--warn-text); background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 10px; padding: 0 8px; }

.badge { display: inline-block; white-space: nowrap; border-radius: 10px; padding: 1px 9px; font-size: 12px; font-weight: 600; line-height: 1.6; }
.badge.draft { background: var(--st-draft-bg); color: var(--st-draft-fg); }
.badge.approved { background: var(--st-approved-bg); color: var(--st-approved-fg); }
.badge.planned { background: var(--st-planned-bg); color: var(--st-planned-fg); }
.badge.progress { background: var(--st-progress-bg); color: var(--st-progress-fg); }
.badge.validated { background: var(--st-validated-bg); color: var(--st-validated-fg); }
.badge.unknown { background: var(--st-unknown-bg); color: var(--st-unknown-fg); }

.pipeline { display: inline-flex; align-items: center; white-space: nowrap; }
.pipeline .step {
  font-size: 12px; line-height: 1.5; padding: 1px 7px; border: 1px solid var(--border);
  border-radius: 4px; text-decoration: none; color: var(--muted); background: transparent;
}
.pipeline .step.absent { border-style: dashed; opacity: .75; }
.pipeline .step.present { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.pipeline .step.failed { background: var(--err-bg); border-color: var(--err-border); color: var(--err-text); }
.pipeline .join { width: 8px; height: 1px; background: var(--border); }

.progress { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.progress .bar { flex: 0 0 90px; height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
.progress .bar > span { display: block; height: 100%; background: var(--ok); }
.progress.big { font-size: 14px; margin: 0 0 14px; }
.progress.big .bar { flex: 1 1 auto; max-width: 320px; height: 10px; border-radius: 5px; }

ul.attention { list-style: none; margin: 0; padding: 0; }
ul.attention li { padding: 10px 16px; border-bottom: 1px solid var(--border); }
ul.attention li:last-child { border-bottom: 0; }
ul.attention .where { font-size: 12px; color: var(--muted); display: block; }
ul.attention .kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; color: var(--warn-text); }

details.about { margin: 0 0 14px; }
details.about summary { cursor: pointer; color: var(--muted); font-size: 13px; }

.back { display: inline-block; margin-bottom: 10px; text-decoration: none; font-size: 14px; }
.spec-head h2 { margin: 0 0 4px; font-size: 22px; line-height: 1.25; }
.spec-head .num { color: var(--muted); font-weight: 400; margin-right: 6px; }
.spec-head .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 6px 0; font-size: 13px; color: var(--muted); }
.spec-head .requires { margin: 6px 0 0; }
.tabs { display: flex; gap: 2px; margin: 16px 0 -1px; position: relative; z-index: 1; overflow-x: auto; overflow-y: hidden; }
.tabs .tab {
  padding: 8px 14px; text-decoration: none; color: var(--muted); white-space: nowrap;
  border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0;
}
.tabs a.tab:hover { color: var(--text); }
.tabs .tab.active { color: var(--text); font-weight: 600; background: var(--surface); border-color: var(--border); }
.tabs .tab.disabled { opacity: .5; cursor: not-allowed; }
.tabs .tab .count { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.tabpanel { background: var(--surface); border: 1px solid var(--border); border-radius: 0 8px 8px 8px; padding: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
.seg a { padding: 4px 12px; font-size: 13px; text-decoration: none; color: var(--muted); }
.seg a + a { border-left: 1px solid var(--border); }
.seg a.active { background: var(--surface-2); color: var(--text); font-weight: 600; }

.req { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.req:last-child { border-bottom: 0; }
.req-head { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.req .id { font-weight: 700; }
.req .crit + .crit { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.req .shared { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.req .none { color: var(--warn-text); background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 6px; padding: 2px 8px; display: inline-block; font-size: 13px; }
.req .md > :first-child { margin-top: 0; }
.req .md > :last-child { margin-bottom: 0; }
.req .col-label { display: none; }

.md { overflow-wrap: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1 { font-size: 24px; line-height: 1.25; margin: 0 0 14px; }
.md h2 { font-size: 19px; margin: 28px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.md h3 { font-size: 16px; margin: 22px 0 8px; }
.md h4, .md h5, .md h6 { font-size: 15px; margin: 18px 0 6px; }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md .table-wrap { margin: 0 0 12px; }
.md ul, .md ol { padding-left: 24px; }
.md li { margin: 3px 0; }
.md li > ul, .md li > ol { margin: 3px 0 0; }
.md li > p { margin: 0 0 6px; }
.md li:has(> input[type="checkbox"]) { list-style: none; margin-left: -20px; }
.md li > input[type="checkbox"] { margin: 0 6px 0 0; }
.md code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .9em; overflow-wrap: anywhere; }
.md a > code { color: inherit; }
.md pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; line-height: 1.45; }
.md pre code { background: none; padding: 0; font-size: 13px; overflow-wrap: normal; white-space: pre; }
.md blockquote { border-left: 3px solid var(--border); padding: 4px 0 4px 14px; color: var(--muted); }
.md blockquote > :last-child { margin-bottom: 0; }
.md del { color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
.md .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; }
.md th, .md td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--border); min-width: 90px; }
.md th { background: var(--surface-2); font-weight: 600; }
.md tr:last-child td { border-bottom: 0; }
.md a.dead { color: var(--muted); text-decoration: underline dotted; cursor: help; }
.md img { max-width: 100%; }

@media (max-width: 760px) {
  .wrap { padding: 12px; }
  table.index thead { position: absolute; left: -9999px; }
  table.index, table.index tbody, table.index tr, table.index td { display: block; width: 100%; }
  table.index tr { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  table.index tbody tr:last-child { border-bottom: 0; }
  table.index td { border: 0; padding: 2px 0; }
  table.index td.num { display: inline; width: auto; }
  table.index td.name { display: inline; width: auto; margin-left: 6px; font-size: 16px; }
  table.index td.requires { margin: 4px 0 6px; }
  table.index td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: 12px; margin-right: 4px; }
  table.index td.status, table.index td.oq { display: inline-block; width: auto; margin-right: 14px; }
  table.index td.pipe { margin-top: 4px; }
  .req, .req-head { grid-template-columns: minmax(0, 1fr); }
  .req-head { display: none; }
  .req .col-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin-top: 8px; }
  .tabpanel { padding: 12px; }
  .md h1 { font-size: 21px; }
}
</style>

  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
  integrity="sha512-jB0TkTBeQC9ZSkBqDhdmfTv1qdfbWpGE72yJ/01Srq6hEzZIz2xkz1e57p9ai7IeHMwEG7HpzG6NdptChif5Pg=="

<body>
<div class="wrap">
  <header class="top">
    <h1><a href="#" id="title">Specs</a></h1>
    <nav class="nav" aria-label="Views"><a href="#" id="nav-index">Index</a><a href="#progress" id="nav-progress">Progress</a></nav>
    <span class="mode" id="mode"></span>
    <span class="loaded" id="loaded" aria-live="polite"></span>
    <button type="button" id="reload" title="Fetch every markdown file again">Reload</button>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
  <div id="tip" role="tooltip" hidden></div>
  <noscript><div class="msg error">This viewer needs JavaScript: it reads the markdown files at view time.</div></noscript>
</div>

<script>
(function () {
'use strict';

// The four files a spec folder can hold, in pipeline order. Which of them exist
// for a given spec is discovered by fetching, never listed here.
var ARTIFACTS = ['spec', 'plan', 'tasks', 'notes'];
var INDEX_FILE = 'README.md';
var SERVE_COMMAND = 'python specs/serve.py';
var SERVE_URL = 'http://127.0.0.1:8777/';
// Status words the index defines, mapped to a badge style. Anything else gets a neutral-odd badge.
var STATUS_CLASS = { 'draft': 'draft', 'approved': 'approved', 'planned': 'planned', 'in progress': 'progress', 'validated': 'validated' };

var app = document.getElementById('app');
var state = null;      // result of the last load()
var filterText = '';
var canEdit = false;   // true only when serve.py answers; a plain static server cannot save
var etags = {};        // path -> ETag of the text this page last read, sent back on save
var editing = null;    // { path, original, text } while a file is open in the editor
// Filters of the progress view. Kept here so a reload or a ticked task does not reset them.
var pf = { q: '', status: '', stage: '', task: 'all', par: false };

/* ---------- small DOM helpers ---------- */

function h(tag, attrs) {
  var el = document.createElement(tag), k, v, i;
  for (k in (attrs || {})) {
    v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.appendChild(fragment(v));           // callers pass sanitised HTML only
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }

/* ---------- progress view ---------- */

var tipEl = document.getElementById('tip');
function tipShow(e, text) {

  if (x + r.width > window.innerWidth - 8) x = Math.max(8, e.clientX - r.width - 12);
  if (y + r.height > window.innerHeight - 8) y = Math.max(8, e.clientY - r.height - 12);

// Gives an element the hover and keyboard-focus tooltip; the same text is its accessible name.
function withTip(el, text) {

  el.addEventListener('blur', tipHide);

}

function statusKey(status) { return status.trim().toLowerCase().replace(/[`*_]/g, '').replace(/[\s-]+/g, ' '); }

// Specs and tasks that pass the filters. A spec stays when it matches, or when
// one of its tasks does; a task filter drops specs left with no task.
function progressSelection(s) {
  var words = pf.q.toLowerCase().split(/\s+/).filter(Boolean);
  var taskFilter = pf.task !== 'all' || pf.par;
  var out = [];
  s.rows.forEach(function (row) {
    if (!row.folder || s.byFolder[row.folder] !== row) return;
    if (pf.status && statusKey(row.status) !== pf.status) return;
    if (pf.stage && row.files[pf.stage] == null) return;
    var specText = (row.num + ' ' + row.name + ' ' + row.requires + ' ' + row.status).toLowerCase();
    var specHit = words.every(function (w) { return specText.indexOf(w) !== -1; });
    var tasks = (row.taskList || []).filter(function (t) {
      if (pf.task === 'open' && t.done) return false;
      if (pf.task === 'done' && !t.done) return false;
      if (pf.par && !t.parallel) return false;
      if (specHit) return true;
      var text = (t.num + ' ' + t.title + ' ' + t.reqs.join(' ') + (t.wave ? ' wave ' + t.wave : '')).toLowerCase();
      return words.every(function (w) { return text.indexOf(w) !== -1 || specText.indexOf(w) !== -1; });
    });
    if (!specHit && !tasks.length) return;
    if (taskFilter && !tasks.length) return;

  return out;
}

// One horizontal bar: done and open segments on a shared scale, 2px apart.
function hbar(done, open, max) {

  if (done) bar.append(h('i', { class: 'done', style: 'flex:' + done + ' 1 0' }));
  if (open) bar.append(h('i', { class: 'open', style: 'flex:' + open + ' 1 0' }));
  return bar;
}
function doneOpenLegend() {
  return h('div', { class: 'pg-legend' }, h('span', {}, h('i', { style: 'background:var(--series-done)' }), 'done'), h('span', {}, h('i', { style: 'background:var(--series-open)' }), 'open'));
}
function count(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

function renderProgress(s) {
  var all = s.rows.filter(function (r) { return r.folder && s.byFolder[r.folder] === r; });
  var redraw = function () { renderProgress(s); };

  /* filters: one row, above everything they act on */
  var statuses = [];
  all.forEach(function (r) { var k = statusKey(r.status); if (k && statuses.indexOf(k) === -1) statuses.push(k); });
  var option = function (value, text, current) { return h('option', { value: value, selected: value === current }, text); };
  var search = h('input', { type: 'search', placeholder: 'Filter specs and tasks', 'aria-label': 'Filter specs and tasks', value: pf.q });
  search.addEventListener('input', function () {
    pf.q = search.value; redraw();
    var again = app.querySelector('.pg-filters input[type="search"]');   // the redraw replaced the field being typed in
    again.focus(); again.setSelectionRange(again.value.length, again.value.length);
  });
  var pick = function (key, options) {
    var sel = h('select', {}, options);
    sel.addEventListener('change', function () { pf[key] = sel.value; redraw(); });

  par.addEventListener('change', function () { pf.par = par.checked; redraw(); });
  var active = pf.q || pf.status || pf.stage || pf.task !== 'all' || pf.par;
  var clear = h('button', { type: 'button', disabled: !active, onclick: function () { pf = { q: '', status: '', stage: '', task: 'all', par: false }; redraw(); } }, 'Clear filters');
  var filters = h('div', { class: 'pg-filters' }, search,

    h('label', {}, 'Tasks', pick('task', [option('all', 'all', pf.task), option('open', 'open', pf.task), option('done', 'done', pf.task)])),
    h('label', {}, par, 'only [P]'),

  var sel = progressSelection(s);
  var tasks = [].concat.apply([], sel.map(function (g) { return g.tasks; }));
  var done = tasks.filter(function (t) { return t.done; }).length;
  var withTasks = sel.filter(function (g) { return g.row.taskList; }).length;
  var markers = sel.reduce(function (n, g) { return n + g.row.markers.length; }, 0);

  /* headline numbers */

  var tiles = h('div', { class: 'pg-tiles' },
    tile(String(sel.length), 'of ' + all.length, 'specs shown'),
    tile(String(done), 'of ' + tasks.length, 'tasks done' + (tasks.length ? ' (' + Math.round(100 * done / tasks.length) + '%)' : '')),
    tile(String(withTasks), 'of ' + sel.length, 'specs have a task list'),
    tile(String(markers), '', 'open clarification marker' + (markers === 1 ? '' : 's')));

  /* chart 1: tasks per spec */
  var maxTasks = Math.max.apply(null, [0].concat(sel.map(function (g) { return g.tasks.length; })));
  var c1 = h('div', { class: 'pg-chart' }, h('h3', {}, 'Tasks per spec'), h('div', { class: 'sub' }, 'Done and open, on one scale. Click a spec to open its tasks.'));
  sel.forEach(function (g) {
    var d = g.tasks.filter(function (t) { return t.done; }).length, o = g.tasks.length - d;
    var has = !!g.row.taskList;
    var tip = label(g.row) + '\n' + (has ? d + ' done, ' + o + ' open' + (active ? ' (filtered)' : '') : 'No tasks.md yet');
    c1.append(withTip(h('a', { class: 'pg-row click', href: '#' + g.row.folder + '/' + (has ? 'tasks' : 'spec') },
      h('span', { class: 'name' }, h('span', { class: 'mono muted' }, g.row.num + ' '), g.row.name),
      has && g.tasks.length ? hbar(d, o, maxTasks) : h('span', { class: 'none' }, has ? 'no task matches' : 'no task list yet'),

  if (!sel.length) c1.append(h('p', { class: 'muted small' }, all.length ? 'No spec matches the filters.' : 'No spec yet.'));
  c1.append(doneOpenLegend());

  /* chart 2: how far the specs are — counted without the "Has" filter, which this chart sets */
  var keep = pf.stage; pf.stage = '';
  var pool = progressSelection(s); pf.stage = keep;
  var c2 = h('div', { class: 'pg-chart' }, h('h3', {}, 'Pipeline reach'), h('div', { class: 'sub' }, 'Specs that have each artifact. Click a bar to filter by it.'));
  ARTIFACTS.forEach(function (a) {
    var have = pool.filter(function (g) { return g.row.files[a] != null; });
    var names = have.map(function (g) { return label(g.row); });
    var tip = a + '.md: ' + count(have.length, 'spec') + ' of ' + pool.length + (names.length ? '\n' + names.join('\n') : '');
    var rowEl = withTip(h('div', { class: 'pg-row click' + (pf.stage === a ? ' on' : ''), role: 'button', tabindex: '0', 'aria-pressed': pf.stage === a ? 'true' : 'false' },
      h('span', { class: 'name' }, a),

    var toggle = function () { pf.stage = pf.stage === a ? '' : a; tipHide(); redraw(); };

  /* chart 3: tasks by wave */

  /* every spec and its tasks: the same data as a list, and where a task is ticked */

        statusBadge(row.status), pipeline(row),
        h('span', { class: 'right' }, row.taskList ? d + ' of ' + g.tasks.length + ' done' + (g.tasks.length !== row.taskList.length ? ' · ' + g.tasks.length + ' of ' + row.taskList.length + ' shown' : '') : 'no task list yet')));
    if (!row.taskList) return box;
    if (!g.tasks.length) { box.append(h('div', { class: 'empty' }, 'No task of this spec matches the filters.')); return box; }

    })));

  show.apply(null, [filters, tiles, h('div', { class: 'pg-charts' }, c1, c2, c3),
    h('h2', { class: 'section' }, 'Specs and tasks' + (active ? ' — filtered' : ''))]
    .concat(groups.length ? groups : [h('p', { class: 'muted' }, all.length ? 'No spec matches the filters.' : 'No spec yet. /sdd-specify writes the first one.')])

/* ---------- spec detail ---------- */

/* ---------- routing ---------- */

function route() {
  if (!state) return;
  var raw = location.hash.replace(/^#\/?/, ''), parts;
  try { raw = decodeURIComponent(raw); } catch (e) { /* keep raw */ }
  parts = raw.split('/').filter(Boolean);
  document.title = state.title || 'Specs';
  tipHide();
  document.getElementById('nav-index').className = parts[0] === 'progress' ? '' : 'active';
  document.getElementById('nav-progress').className = parts[0] === 'progress' ? 'active' : '';
  if (!parts.length) { renderOverview(state); return; }
  if (parts[0] === 'progress' && !state.byFolder.progress) {
    document.title = 'Progress — ' + (state.title || 'Specs');
    renderProgress(state); return;
  }
  var row = state.byFolder[parts[0]];
  if (!row) {
    show(h('a', { class: 'back', href: '#' }, '← All specs'), h('div', { class: 'msg' }, 'The index has no spec in a folder named "' + parts[0] + '".'));
    return;
  }
  var tab = ARTIFACTS.indexOf(parts[1]) !== -1 ? parts[1] : ARTIFACTS[0];
  document.title = label(row) + ' · ' + tab + ' — ' + (state.title || 'Specs');
  renderSpec(state, row, tab, tab === 'spec' && parts[2] === 'requirements');
}

function refresh() {
  var btn = document.getElementById('reload'), stamp = document.getElementById('loaded');
  btn.disabled = true; stamp.textContent = 'Loading…';
  return load().then(function (s) {
    state = s;
    document.getElementById('title').textContent = s.title || 'Specs';
    stamp.textContent = 'Read ' + s.loadedAt.toLocaleTimeString();
    route();
  }).catch(function (err) {
    stamp.textContent = '';
    show(h('div', { class: 'msg error' }, h('strong', {}, 'Could not load the specs. '), err && err.message ? err.message : String(err)));
  }).then(function () { btn.disabled = false; });
}

function boot() {
  if (location.protocol === 'file:') {
    document.getElementById('reload').hidden = true;
    show(h('div', { class: 'msg' },
      h('strong', {}, 'This page has to be served over HTTP.'),
      h('p', {}, 'It reads the markdown files beside it when you open it, and a browser will not let a page opened straight from disk do that. In a terminal, at the root of the repository, run:'),
      h('pre', {}, SERVE_COMMAND),
      h('p', { style: 'margin-bottom:0' }, 'then open ', h('a', { href: SERVE_URL }, SERVE_URL), '.')));
    return;
  }
  if (!window.marked || !window.DOMPurify) {
    show(h('div', { class: 'msg error' }, h('strong', {}, 'The markdown libraries did not load. '),
      'This page fetches marked and DOMPurify from cdnjs.cloudflare.com; check the network connection and reload.'));
    return;
  }
  marked.use({ gfm: true, breaks: false });
  var shownHash = location.hash, undoing = false;
  window.addEventListener('hashchange', function () {
    if (undoing) { undoing = false; return; }
    if (isDirty() && !window.confirm('Discard your unsaved changes to ' + editing.path + '?')) {
      undoing = true; location.hash = shownHash; return;
    }
    editing = null; shownHash = location.hash;
    route(); window.scrollTo(0, 0);
  });
  window.addEventListener('beforeunload', function (e) { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
  document.getElementById('reload').addEventListener('click', function () {
    if (isDirty() && !window.confirm('Reloading discards your unsaved changes to ' + editing.path + '. Continue?')) return;
    editing = null; refresh();
  });
  // Only serve.py answers this; under a plain static server the page stays read-only.
  fetch('__edit', { cache: 'no-store' }).then(function (res) { return res.ok ? res.json() : null; })
    .then(function (j) { canEdit = !!(j && j.edit); }, function () { canEdit = false; })
    .then(function () {
      var mode = document.getElementById('mode');
      mode.textContent = canEdit ? 'Editing on' : 'Read-only';
      mode.title = canEdit ? 'Saves write straight to the markdown files' : 'Start the page with "' + SERVE_COMMAND + '" to edit';
      refresh();
    });
}

boot();
})();
</script>
</body>
</html>
