# Production stack (plan.md "Deploy"). Keycloak is external, reached through OIDC_ISSUER.
#   cp .env.example .env   # fill in real values; never commit .env (constitution rule 7)
#   docker compose build sandbox   # tags the sandbox image; it has no running service
#   docker compose up -d --build
name: collab-coding

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Builds and tags the sandbox image `runner` starts per run (plan: Run pipeline, step 4).
  # Excluded from the default profile so plain `up` (with or without --wait) never starts
  # it: `docker compose build sandbox` builds and tags the image without running it.
  sandbox:
    build: sandbox
    image: ${SANDBOX_IMAGE:-collab-sandbox:latest}
    profiles: ["build-only"]

  # Starts sandbox containers on the host's Docker (plan: Runner contract). The only
  # service that touches the Docker socket.
  runner:
    build: runner
    environment:
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-collab-sandbox:latest}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The api; also serves the built frontend (backend/app/main.py).
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      ROLE_EDITOR: ${ROLE_EDITOR:-editor}
      ROLE_ADMIN: ${ROLE_ADMIN:-admin}
      SESSION_COOKIE_KEY: ${SESSION_COOKIE_KEY:?set SESSION_COOKIE_KEY}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-3600}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      RUNNER_URL: http://runner:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_healthy

volumes:
  db-data:
