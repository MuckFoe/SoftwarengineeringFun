# Services for the integration tests (plan.md "Test strategy").
#
#   export TEST_DB_PASSWORD=<any random value>   # never committed (constitution rule 7)
#   docker compose -f docker-compose.test.yml up -d --wait
#   (cd backend && uv run pytest)
#
# TEST_DB_PORT (default 55432) is the host port Postgres is published on.
name: collab-coding-test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?set TEST_DB_PASSWORD}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Runner (plan: Runner contract). Starts sandbox containers on the host's Docker, so
  # the sandbox image must exist there first: docker build -t collab-sandbox:test sandbox
  # SANDBOX_RUNTIME=runsc enables gVisor where it is installed. TEST_RUNNER_PORT
  # (default 58080) is the host port.
  runner:
    build: runner
    environment:
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-collab-sandbox:test}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${TEST_RUNNER_PORT:-58080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Keycloak with the test realm (backend/tests/keycloak/realm.json, no credentials).
  # TEST_KEYCLOAK_ADMIN_PASSWORD is the master admin's password, any random value; the
  # fixtures use it to create users and rotate the client secret per run.
  # TEST_KEYCLOAK_PORT (default 58180) is the host port.
  #
  # KC_HOSTNAME fixes the browser-facing issuer/authorization endpoint at 127.0.0.1, so a
  # real browser (task 39's Playwright, on the host) can always reach it; backchannel-dynamic
  # lets a caller behind a different hostname (the api container, via host.docker.internal)
  # still reach the token/userinfo/jwks endpoints at the host it actually used.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${TEST_KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TEST_KEYCLOAK_ADMIN_PASSWORD:?set TEST_KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: "http://127.0.0.1:${TEST_KEYCLOAK_PORT:-58180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./backend/tests/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      # Spec 003 FR-18: the app-styled login theme, selected by the realm's loginTheme.
      - ./keycloak-theme/collab:/opt/keycloak/themes/collab:ro
    ports:
      - "127.0.0.1:${TEST_KEYCLOAK_PORT:-58180}:8080"
    healthcheck:
      # The image has no curl; ask the management port's readiness probe over bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Spec 007: the fake GIPHY (backend/tests/fakes/fake_giphy.py, stdlib only) for the E2E
  # stack. Its fixture media URLs point at its own host port, so the browser (Playwright,
  # on the host) loads them; the api container reaches the API through
  # host.docker.internal (e2e/global-setup.ts sets GIPHY_BASE_URL and a dummy
  # GIPHY_API_KEY). The control port (switch off/on, recorded requests) stays up while the
  # API is off; e2e/fixtures.ts drives it. TEST_GIPHY_PORT (default 58280) and
  # TEST_GIPHY_CONTROL_PORT (default 58281) are the host ports.
  giphy:
    image: python:3.12-slim
    command:
      - python
      - /fake/fake_giphy.py
      - --host=0.0.0.0
      - --port=8080
      - --control-port=8081
      - --media-base=http://127.0.0.1:${TEST_GIPHY_PORT:-58280}
    volumes:
      - ./backend/tests/fakes/fake_giphy.py:/fake/fake_giphy.py:ro
    ports:
      - "127.0.0.1:${TEST_GIPHY_PORT:-58280}:8080"
      - "127.0.0.1:${TEST_GIPHY_CONTROL_PORT:-58281}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Spec 020: the fake OpenAI-compatible model (backend/tests/fakes/fake_llm.py, stdlib only)
  # for the E2E stack. The api container reaches it through host.docker.internal
  # (e2e/global-setup.ts sets HINTS_LLM_BASE_URL to its /v1 and HINTS_LLM_MODEL=fake-model).
  # The control port (recorded requests, reset, one-shot cold) stays up on its own port.
  # TEST_LLM_PORT (default 58380) and TEST_LLM_CONTROL_PORT (default 58381) are the host ports.
  llm:
    image: python:3.12-slim
    command:
      - python
      - /fake/fake_llm.py
      - --host=0.0.0.0
      - --port=8080
      - --control-port=8081
      - --model=fake-model
    volumes:
      - ./backend/tests/fakes/fake_llm.py:/fake/fake_llm.py:ro
    ports:
      - "127.0.0.1:${TEST_LLM_PORT:-58380}:8080"
      - "127.0.0.1:${TEST_LLM_CONTROL_PORT:-58381}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 1s
      timeout: 3s
      retries: 30
